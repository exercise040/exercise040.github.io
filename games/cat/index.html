<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cat's Room — exercise040</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="../../index.html">exercise040</a>
    <span id="status">IDLE</span>
  </header>

  <main id="world">
    <div class="room-label">
      CAT'S ROOM
      <small>W A S D — MOVE</small>
    </div>

    <!-- Original oneko sprite sheet supplied by the user -->
    <div id="oneko" aria-hidden="true"></div>

    <div class="door" data-event="about" style="left:18%;top:70%;">
      <div class="door-body"></div>
      <span>ABOUT</span>
    </div>

    <div class="door" data-event="projects" style="left:50%;top:24%;">
      <div class="door-body"></div>
      <span>PROJECTS</span>
    </div>

    <div class="door" data-event="secret" style="left:82%;top:70%;">
      <div class="door-body secret">?</div>
      <span>SECRET</span>
    </div>

    <div id="event-box" hidden>
      <button id="close-event" type="button" aria-label="close">×</button>
      <div id="event-content"></div>
    </div>
  </main>

  <footer>
    <span>W A S D — MOVE</span>
    <span>ENTER — OPEN DOOR</span>
  </footer>

  <script src="game.js"></script>
</body>
</html>
